name: Native build and SPDX check

on:
  workflow_call:
    inputs:
      source-ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  archive:
    name: Docker archive (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AMD64
            architecture: amd64
            machine: x86_64
            system: x86_64-linux
            runner: ubuntu-24.04
          - name: ARM64
            architecture: arm64
            machine: aarch64
            system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      ARCHITECTURE: ${{ matrix.architecture }}
      NIX_SYSTEM: ${{ matrix.system }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32
      - name: Build the native Docker archive
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          nix build --no-update-lock-file --print-build-logs ".#packages.$NIX_SYSTEM.dockerImage"
      - name: Load the archive and verify the FUSE SPDX attestation
        run: |
          if [[ ! -c /dev/fuse ]]; then sudo modprobe fuse; fi
          image_attr=".#packages.$NIX_SYSTEM.dockerImage"
          image="$(nix eval --no-update-lock-file --raw "$image_attr.imageName"):$(nix eval --no-update-lock-file --raw "$image_attr.imageTag")"
          version=$(nix eval --no-update-lock-file --raw ".#packages.$NIX_SYSTEM.buildkit.version")
          revision=$(jq -er '.nodes["buildkit-src"].locked.rev' flake.lock)
          docker load --input result
          bash tests/sbom.sh "$image" "$ARCHITECTURE" "$version" "$revision"
      - name: Stage the verified Docker archive
        run: cp -L result "$RUNNER_TEMP/buildkit-$ARCHITECTURE.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buildkit-${{ matrix.architecture }}
          path: ${{ runner.temp }}/buildkit-${{ matrix.architecture }}.tar.gz
          compression-level: 0
          if-no-files-found: error
